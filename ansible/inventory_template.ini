# Ansible Inventory Template
# Define your Juniper devices here and group them by device type or location

[juniper_devices]
# Standalone devices - specify device model so package naming is correct
ex2300-device-01 ansible_host=192.168.1.10 target_version=23.4 device_model=ex2300
ex4100-device-01 ansible_host=192.168.1.11 target_version=23.4 device_model=ex4100
srx345-device-01 ansible_host=192.168.1.12 target_version=23.4 device_model=srx345

# Virtual chassis members - primary member manages the upgrade
# Note: Configure primary member in inventory; role detects and manages secondary members
ex4400-vc-member0 ansible_host=192.168.2.10 target_version=23.4 device_model=ex4400
ex4300-vc-member0 ansible_host=192.168.2.20 target_version=23.4 device_model=ex4300

[juniper_devices:vars]
# Common connection settings
ansible_connection=network_cli
ansible_network_os=junos
ansible_user=admin
ansible_become=yes
ansible_become_method=enable

# FTP server details (also in vault)
ftp_server=ftp.example.local
ftp_path=images/junos

# Upgrade timeout (in minutes) - default is 10
# Can be overridden per device or per group
upgrade_timeout_minutes=10
