---
# two plays: switches first, then routers

- name: Upgrade switches with pre/post checks
  hosts: "{{ target_group }}:&switches"
  gather_facts: no
  vars:
    repo_base: "ftp://repo.example.com/junos"
    reboot_timeout: 300                # override with -e if desired
    # mapping of major versions to an ordered upgrade path
    upgrade_paths:
      "19": ["21", "23"]
      "20": ["21", "23"]
      "21": ["23"]
    # map hardware model strings to package name templates
    package_map:
      SRX345: "junos-{{ item }}-srx345.tgz"
      EX4100: "junos-{{ item }}-ex4100.tgz"
      EX2300: "junos-{{ item }}-ex2300.tgz"
    default_package: "junos-{{ item }}.tgz"
  tasks:
    - name: gather current version
      junos_facts:
      register: facts

    - name: compute upgrade sequence
      set_fact:
        current_major: "{{ facts.ansible_facts.net_version.split('-')[0].split('.')[0] }}"
        sequence: >-
          {{ upgrade_paths[current_major] | default([target_version]) }}

    - name: determine package names for sequence
      set_fact:
        model: "{{ facts.ansible_facts.net_model }}"
        pkg_items: >-
          {{ sequence
             | map('regex_replace','^(.*)$', package_map.get(model, default_package))
             | list }}

    - name: save version/sequence info
      copy:
        content: "{{ {'current_version': facts.ansible_facts.net_version,
                       'sequence': sequence,
                       'model': model,
                       'pkgs': pkg_items} | to_nice_json }}\n"
        dest: "logs/{{ inventory_hostname }}_version.json"

    - name: Collect pre‑check data
      junos_command:
        commands:
          - show interfaces terse
          - show isis neighbors
          - show lldp neighbors
      register: precheck

    - name: Save pre‑check results for reporting
      copy:
        content: "{{ precheck.stdout | to_nice_json }}\n"
        dest: "logs/{{ inventory_hostname }}_pre.json"

    - name: Perform upgrade steps for each intermediate version
      junos_install_os:
        version: "{{ item }}"
        no_copy: yes
        reboot: yes
        remote_host: "{{ inventory_hostname }}"
        domain: "{{ repo_base }}"
        package: "{{ pkg_items[loop.index0] }}"
      loop: "{{ sequence }}"
      when:
        - target_version is defined
        - item is defined

    - name: Wait for device to be reachable after reboot
      wait_for_connection:
        timeout: "{{ reboot_timeout }}"

    - name: Collect post‑check data
      junos_command:
        commands:
          - show interfaces terse
          - show isis neighbors
          - show lldp neighbors
      register: postcheck

    - name: Save post‑check results for reporting
      copy:
        content: "{{ postcheck.stdout | to_nice_json }}\n"
        dest: "logs/{{ inventory_hostname }}_post.json"

