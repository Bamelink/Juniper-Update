---
# Pre-upgrade checks: gather interface status, LLDP neighbors, dot1x statistics

- name: Gather pre-upgrade checks
  block:
    - name: Get interface status
      juniper.junos.junos_command:
        commands:
          - show interfaces terse
      register: pre_interfaces
    
    - name: Get LLDP neighbors
      juniper.junos.junos_command:
        commands:
          - show lldp neighbors
      register: pre_lldp
    
    - name: Get dot1x statistics
      juniper.junos.junos_command:
        commands:
          - show dot1x statistics
      register: pre_dot1x
    
    - name: Save pre-upgrade snapshot
      set_fact:
        pre_checks:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          interfaces: "{{ pre_interfaces.stdout_lines[0] | default([]) }}"
          lldp: "{{ pre_lldp.stdout_lines[0] | default([]) }}"
          dot1x: "{{ pre_dot1x.stdout_lines[0] | default([]) }}"
  
  tags: precheck
