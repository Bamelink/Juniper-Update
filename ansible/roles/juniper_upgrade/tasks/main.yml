---
# Main upgrade role: fetch current version, compute path, and perform upgrade

- name: Fetch device information
  juniper.junos.junos_command:
    commands:
      - show version
      - show chassis hardware models
  register: device_info

- name: Extract current version
  set_fact:
    current_version: "{{ device_info.stdout[0] | regex_search('JUNOS Software Release \\[([0-9.]+)\\]', '\\1') }}"

- name: Extract device model
  set_fact:
    device_model: "{{ device_info.stdout[1] | regex_search('Model: ([A-Za-z0-9-]+)', '\\1') | lower }}"

- name: Validate current version was extracted
  fail:
    msg: "Could not extract current version from device"
  when: not current_version

- name: Validate device model was extracted
  fail:
    msg: "Could not extract device model from device"
  when: not device_model

- name: Determine package naming pattern
  set_fact:
    package_pattern: "{{ juniper_package_names.get(device_model, 'junos-{version}.tgz') }}"

- name: Debug device info
  debug:
    msg: "Device {{ inventory_hostname }}: model={{ device_model }}, current={{ current_version }}, target={{ target_version }}, package_pattern={{ package_pattern }}"

- name: Compute upgrade path for this device
  delegate_to: localhost
  run_once: false
  command: >-
    python3 lib/upgrade_path.py --current {{ current_version }} --target {{ target_version }} --format json
  register: path_result
  failed_when: path_result.rc != 0

- name: Parse upgrade path
  set_fact:
    upgrade_path: "{{ (path_result.stdout | from_json).path }}"

- name: Display upgrade path
  debug:
    msg: "Upgrade path for {{ inventory_hostname }}: {{ upgrade_path }}"

- name: Install images via FTP (device fetches directly)
  juniper.junos.junos_software:
    package: "ftp://{{ ftp_user }}:{{ ftp_password }}@{{ ftp_server }}/{{ ftp_path }}/{{ package_pattern.replace('{version}', item) }}"
    reboot: true
    validate: true
  loop: "{{ upgrade_path }}"
  register: install_result
  failed_when: install_result.rc != 0
  timeout: "{{ upgrade_timeout_minutes * 60 }}"

- name: Wait for device to come back online
  wait_for_connection:
    delay: 30
    timeout: "{{ upgrade_timeout_minutes * 60 }}"

- name: Verify upgrade completed
  juniper.junos.junos_command:
    commands:
      - show version
  register: version_check

- name: Extract new version
  set_fact:
    new_version: "{{ version_check.stdout[0] | regex_search('JUNOS Software Release \\[([0-9.]+)\\]', '\\1') }}"

- name: Verify target version reached
  fail:
    msg: "Upgrade failed: device is on {{ new_version }}, expected {{ target_version }}"
  when: new_version != target_version

- name: Upgrade successful
  debug:
    msg: "SUCCESS: {{ inventory_hostname }} ({{ device_model }}) upgraded to {{ new_version }}"
